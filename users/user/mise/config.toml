# Global mise config for `make lite` machines (no nix): the CLI essentials as
# prebuilt release binaries — no compiling, which matters on Intel Macs, where
# Homebrew stopped building bottles in September 2026. Linked to
# ~/.config/mise/config.toml by lite/link.sh. `mise upgrade` updates everything.
#
# No prebuilt macOS binaries exist for eza, btop or tmux, so they are left out;
# the zshrc falls back to ls when eza is missing. atuin is left out too: mise's
# aqua registry has no darwin/amd64 entry for it (the zshrc skips it when absent).
[tools]
neovim = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
fzf = "latest"
lazygit = "latest"
zoxide = "latest"
direnv = "latest"
oh-my-posh = "latest"
jq = "latest"
"github:herdrdev/herdr" = "latest"

[settings]
experimental = true
