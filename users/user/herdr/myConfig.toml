onboarding = false
# herdr configuration — deployed to ~/.config/herdr/config.toml
# Full annotated defaults: `herdr --default-config`
# Validate after editing:  `herdr config check`
# Apply without restart:   `herdr server reload-config`  (or prefix+shift+R)

[keys]
# Leader/prefix key. Matches the tmux prefix in ../tmux/tmux.conf (C-a).
# Pressing it twice sends a literal ctrl+a to the pane (herdr's built-in
# send-prefix, equivalent to tmux's `bind-key a send-prefix`), so
# beginning-of-line still works and a nested tmux still sees its prefix.
# It is hardcoded, not a bindable action, so it does not appear below.
prefix = "ctrl+a"

# Everything below is prefix-relative, so it follows the prefix automatically:
#   prefix+?  help          prefix+w  workspace picker   prefix+c  new tab
#   prefix+q  detach        prefix+g  goto               prefix+n / prefix+p  next / prev tab
#   prefix+s  settings      prefix+b  toggle sidebar     prefix+1..9  switch tab
#   prefix+v  split vertical    prefix+minus  split horizontal
#   prefix+h/j/k/l  focus pane   prefix+z  zoom          prefix+x  close pane
#   prefix+shift+R  reload this file
# Splits stay on the defaults (v / minus); the tmux-style | and _ overrides
# and the Ghostty quick-terminal command were removed 2026-09-19.

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
# tmux-style panes (chosen 2026-09-19 after trying off / framed / gapped):
# thin inner splitters only, no outer frame, neighbours share one divider.
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
